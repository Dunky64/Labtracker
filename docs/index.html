<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Labtracker Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><img src="favicon.svg" alt="" width="22" height="22"> Labtracker</div>
      <div class="who" id="who"></div>
      <div class="updated" id="updated"></div>
    </header>

    <main id="main" hidden>
      <section class="card status" id="status" aria-live="polite"></section>

      <nav class="controls" aria-label="View">
        <div class="tabs" role="tablist">
          <button role="tab" data-view="day" aria-selected="true">Day</button>
          <button role="tab" data-view="week" aria-selected="false">Week</button>
          <button role="tab" data-view="month" aria-selected="false">Month</button>
        </div>
        <div class="datenav">
          <button id="prev" aria-label="Previous">‹</button>
          <span id="range-label"></span>
          <button id="next" aria-label="Next">›</button>
          <button id="today" class="ghost">Today</button>
        </div>
      </nav>

      <section class="tiles" id="tiles"></section>
      <section class="card" id="chart-card">
        <div class="legend" id="legend">
          <span><i class="sw sw-active"></i>At desk</span>
          <span><i class="sw sw-away"></i>Away (still counted as worked)</span>
        </div>
        <div id="chart"></div>
      </section>
      <section class="card" id="detail"></section>
    </main>

    <section class="card notice" id="notice" hidden></section>

    <footer class="foot">
      Times are UK time. "Away" means no keyboard or mouse use for 10+ minutes; it isn't taken off hours worked.
      "Adjusted" marks a time the employee corrected. Data is end-to-end encrypted and decrypted only in this browser.
      <span id="source"></span>
    </footer>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
</body>
</html>
